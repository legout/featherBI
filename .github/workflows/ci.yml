name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DUCKDB_VERSION: 2.0.1
      DUCKDB_URL: https://github.com/duckdb/duckdb/releases/download
      DUCKDB_SHA256: >-
        b676268be4d39e4e41a904442c9796c9914e645cc085c7505f048f2c992b5eca
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install the DuckDB CLI
        run: |
          curl -fsSL -o duckdb.tar.gz \
            "${DUCKDB_URL}/v${DUCKDB_VERSION}/duckdb-cli-linux-amd64.tar.gz"
          echo "${DUCKDB_SHA256}  duckdb.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf duckdb.tar.gz -C "$HOME/.local/bin" duckdb
          rm duckdb.tar.gz
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: duckdb --version
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
      - run: npm test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
