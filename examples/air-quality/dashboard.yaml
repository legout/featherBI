title: Air quality
name: air-quality
sources:
  readings:
    read: "read_parquet('readings.parquet')"
dims:
  station: {col: station}
date: {col: read_at, default: all}
tiles:
  - type: kpi
    title: Readings
    sql: "SELECT COUNT(*) AS value FROM readings WHERE {{filters:readings}}"
  - type: kpi
    title: Average PM2.5
    sql: "SELECT ROUND(AVG(pm25), 2) AS value FROM readings WHERE {{filters:readings}}"
  - type: kpi
    title: Peak PM2.5
    sql: "SELECT MAX(pm25) AS value FROM readings WHERE {{filters:readings}}"
  - type: kpi
    title: Minimum PM2.5
    sql: "SELECT MIN(pm25) AS value FROM readings WHERE {{filters:readings}}"
  - type: kpi
    title: Hours above 35
    sql: "SELECT COUNT(*) AS value FROM readings WHERE pm25 > 35 AND {{filters:readings}}"
  - type: echarts
    preset: line
    title: Daily average by station
    sql: >
      SELECT strftime(read_at, '%Y-%m-%d') AS x, ROUND(AVG(pm25), 2) AS y, station AS series
      FROM readings WHERE {{filters:readings}} GROUP BY 1, 3 ORDER BY 3, 1
  - type: echarts
    preset: bar
    title: Hours above 35 by station
    click: station
    exclude: [station]
    sql: >
      SELECT station AS x, COUNT(*) AS y
      FROM readings WHERE pm25 > 35 AND {{filters:readings}} GROUP BY 1 ORDER BY 1
  - type: echarts
    preset: heatmap
    title: Average by hour of day
    sql: >
      SELECT station AS x, hour(read_at) AS y, ROUND(AVG(pm25), 2) AS value
      FROM readings WHERE {{filters:readings}} GROUP BY 1, 2 ORDER BY 1, 2
