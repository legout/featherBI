title: Energy smart meter
name: energy-smart-meter
sources:
  readings:
    read: "read_parquet('readings.parquet')"
dims:
  meter: {col: meter}
date: {col: read_at, default: all}
tiles:
  - type: kpi
    title: Consumption kWh
    sql: "SELECT SUM(kwh) AS value FROM readings WHERE {{filters:readings}}"
  - type: kpi
    title: Peak demand kW
    sql: "SELECT MAX(kwh) * 4 AS value FROM readings WHERE {{filters:readings}}"
  - type: kpi
    title: Intervals
    sql: "SELECT COUNT(*) AS value FROM readings WHERE {{filters:readings}}"
  - type: kpi
    title: Meter M1 kWh
    sql: "SELECT SUM(kwh) AS value FROM readings WHERE meter = 'M1' AND {{filters:readings}}"
  - type: echarts
    preset: line
    title: Daily consumption by meter
    sql: >
      SELECT strftime(read_at, '%Y-%m-%d') AS x, SUM(kwh) AS y, meter AS series
      FROM readings WHERE {{filters:readings}} GROUP BY 1, 3 ORDER BY 3, 1
  - type: echarts
    preset: heatmap
    title: Consumption by hour and meter
    sql: >
      SELECT meter AS x, hour(read_at) AS y, SUM(kwh) AS value
      FROM readings WHERE {{filters:readings}} GROUP BY 1, 2 ORDER BY 1, 2
  - type: echarts
    preset: bar
    title: Consumption by meter
    click: meter
    exclude: [meter]
    sql: >
      SELECT meter AS x, SUM(kwh) AS y
      FROM readings WHERE {{filters:readings}} GROUP BY 1 ORDER BY 1
