<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{title}}</title>
<script type="importmap">{{importmap}}</script>
<style>{{css}}</style>
</head>
<body class="min-h-screen bg-base-200 text-base-content">
<header class="navbar bg-base-100 px-4 shadow-sm sm:px-6">
  <h1 class="flex-1 text-lg font-semibold tracking-tight">{{title}}</h1>
  <label class="flex items-center gap-2">
    <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <input type="checkbox" id="theme" class="toggle toggle-sm theme-controller" value="night" aria-label="Dark theme">
    <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
  </label>
  <!-- Start in the viewer's system theme; set before first paint, never saved. -->
  <script>document.getElementById("theme").checked = matchMedia("(prefers-color-scheme: dark)").matches;</script>
</header>
<main class="mx-auto max-w-[1600px] space-y-4 p-4 sm:p-6">
  <section id="filters" class="flex flex-wrap items-end gap-3" aria-label="Filters"></section>
  <section id="kpis" class="grid grid-cols-1 gap-4 sm:grid-cols-2 xl:grid-cols-4" aria-label="Key figures"></section>
  <section id="tiles" class="grid grid-cols-1 gap-4 lg:grid-cols-2" aria-label="Charts and notes"></section>
</main>
<script type="application/json" id="dashboard">{{data}}</script>
<script type="module">
{{renderer}}
</script>
</body>
</html>
