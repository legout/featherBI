# Sober blue and grey with square corners. Status colours (info, success,
# warning, error) are the default theme's.
name: Corporate
light:
  base-100: "#ffffff"
  base-200: "#f3f5f8"
  base-300: "#dfe3ea"
  base-content: "#1f2a37"
  primary: "#1d4f91"
  primary-content: "#ffffff"
  secondary: "#4b5b70"
  secondary-content: "#ffffff"
  accent: "#0f766e"
  accent-content: "#ffffff"
  neutral: "#27313f"
  neutral-content: "#f3f5f8"
dark:
  base-100: "#1b222c"
  base-200: "#151b23"
  base-300: "#0f141a"
  base-content: "#e3e8ef"
  primary: "#8fb4e8"
  primary-content: "#0f1d30"
  secondary: "#a9b6c8"
  secondary-content: "#151b23"
  accent: "#5ec4b6"
  accent-content: "#0c2420"
  neutral: "#2f3a48"
  neutral-content: "#e3e8ef"
radius: 0
