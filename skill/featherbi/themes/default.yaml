# The look of a dashboard without `theme`: DaisyUI winter (light) and night
# (dark), as prebuilt into assets/app.css. A token a theme file leaves out
# takes its value from here. One colour differs from DaisyUI: light
# primary-content is white, because winter's own reaches only 3.6:1 on primary.
