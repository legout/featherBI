# WCAG AAA text contrast: base-content on base-100 is 21:1 and every
# *-content colour is at least 7:1 on its surface, in light and dark.
name: High contrast
light:
  base-100: "#ffffff"
  base-200: "#f0f0f0"
  base-300: "#c4c4c4"
  base-content: "#000000"
  primary: "#0037a6"
  primary-content: "#ffffff"
  secondary: "#5b1a8e"
  secondary-content: "#ffffff"
  accent: "#8a0048"
  accent-content: "#ffffff"
  neutral: "#000000"
  neutral-content: "#ffffff"
  info: "#00429d"
  info-content: "#ffffff"
  success: "#005a2b"
  success-content: "#ffffff"
  warning: "#6b4400"
  warning-content: "#ffffff"
  error: "#a30000"
  error-content: "#ffffff"
dark:
  base-100: "#000000"
  base-200: "#1a1a1a"
  base-300: "#3d3d3d"
  base-content: "#ffffff"
  primary: "#8ab8ff"
  primary-content: "#000000"
  secondary: "#d4a6ff"
  secondary-content: "#000000"
  accent: "#ff9ecb"
  accent-content: "#000000"
  neutral: "#ffffff"
  neutral-content: "#000000"
  info: "#7cd4ff"
  info-content: "#000000"
  success: "#6ee7a0"
  success-content: "#000000"
  warning: "#ffd24d"
  warning-content: "#000000"
  error: "#ff9a9a"
  error-content: "#000000"
